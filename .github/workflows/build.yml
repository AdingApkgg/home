# 构建部署
name: Build & Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v6

      # 安装 bun
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 复制环境变量文件
      - name: Copy .env.example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      # 安装项目依赖
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # 构建程序
      - name: Build Website
        run: bun run build

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Home
          path: out
